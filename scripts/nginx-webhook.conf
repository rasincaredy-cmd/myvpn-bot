# Приём уведомлений об оплате: TLS наружу, бот внутри на localhost.
#
# Ставится на хост бота как /etc/nginx/sites-available/webhook (симлинк в
# sites-enabled). Сертификат — Let's Encrypt на IP-адрес сервера: такие
# сертификаты живут 160 часов, поэтому продление обязано быть автоматическим
# (таймер certbot + deploy-hook, перезагружающий nginx).
#
# Подтверждение владения адресом — только webroot (см. location ниже): 80-й
# порт занят этим самым nginx навсегда, и standalone-подтверждение на живом
# сервере обречено падать с «Address already in use».
#
# Адрес для кабинета Platega: https://<IP>/platega/webhook
#
# ВНИМАНИЕ: <IP> ниже подставляется при установке (см. README, раздел про
# приём уведомлений). Сертификат выпускается на тот же адрес.

server {
    listen 80;
    server_name _;

    # Проверка владения адресом при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Всё остальное по http закрыто: провайдер ходит только по https.
    location / {
        return 444;
    }
}

server {
    # http2 включён старым синтаксисом: на хосте бота nginx 1.18, отдельная
    # директива `http2 on` появилась только в 1.25.
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/IP_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/IP_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Сервер отдаёт наружу ровно один путь. Всё прочее — молча рвём
    # соединение: адрес светится в кабинете провайдера, и его будут сканировать.
    location = /platega/webhook {
        proxy_pass http://127.0.0.1:8081/platega/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Провайдер ждёт ответ 60 секунд, дальше считает доставку неудачной.
        proxy_read_timeout 30s;
    }

    location / {
        return 444;
    }
}
